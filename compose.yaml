services:
  backend:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./dev/backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ai

  ai:
    image: nginx:stable-alpine
    volumes:
      - ./dev/guide.json:/usr/share/nginx/html/guide.json:ro
